<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2348" />
    <title>JMRoutes Coletor — sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fa; color: #0f2348; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border-radius: 20px; background: #fff; box-shadow: 0 16px 45px rgba(15,35,72,.12); text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { margin: 0 0 22px; color: #5d687a; line-height: 1.5; }
      button { min-height: 46px; width: 100%; border: 0; border-radius: 12px; background: #0f2348; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/jm-coletor-192.png" alt="JM Transportes" />
      <h1>Sem conexão</h1>
      <p>Conecte o celular à internet para continuar a operação no JMRoutes Coletor.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
